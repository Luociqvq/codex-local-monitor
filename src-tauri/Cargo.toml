[package]
name = "codex-local-monitor"
version = "0.4.13"
description = "Local Codex desktop monitor for sub2api and CPA/CLIProxyAPI"
authors = ["Luoci"]
edition = "2021"

[lib]
name = "token_orb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
tauri = { version = "=2.5.1", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-updater = "=2.7.1"
tauri-plugin-dialog = "=2.2.2"
tauri-plugin-process = "=2.2.0"
tauri-plugin-opener = "=2.2.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
